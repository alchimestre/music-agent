# Copy to `config.toml` and edit. Credentials and the Soulseek ports live in `.env`.

[paths]
# Relative paths resolve against this file's directory.
staging    = "~/Music/music-agent/staging"
lossless   = "~/Music/music-agent/lossless"
lossy      = "~/Music/music-agent/lossy"
state      = "~/Music/music-agent/state"

[loudness]
target_lufs  = -14.0
true_peak_db = -1.0
tolerance_lu = 0.5                              # a file already inside it is left alone

[soulseek]
# Pinned to a commit: the match rules read specific fields, and a rebuild must not move them. This is a fork
# of `voidtype/slsk_mcp` that pins aioslsk 1.7.1: at 1.4.1 the client stops answering the moment a frame
# fails to deserialize, and every search after that reads as an empty network.
command = [
  "uvx",
  "--from",
  "git+https://github.com/alchimestre/slsk-mcp.git@892a2a8aec192a1660f24a5313321adc907fafa4",
  "slsk-mcp",
]

# The listening ports are in `.env`. The download directory is not here either: `paths.staging` is handed to
# the child as SLSK_DOWNLOAD_DIR.

# Ceilings handed to the child as SLSK_*. `max_operations` is the socket lock: a search holds it for its whole
# window and a download start takes it again, so it has to clear `max_searches` with a start to spare.
# The invariant that bites: `max_searches` must be at least `workers`, because every track in flight may be
# holding a search, and one queued behind this lock times out at the call deadline rather than waiting. A
# smaller number here does not slow the pass down, it ends it: four timeouts in a row stop it.
# `workers` must not exceed `max_downloads` either, or a download start blocks on the transfer ceiling.
max_downloads  = 20
max_searches   = 24
max_operations = 32
workers        = 20

# Seconds between two searches. A throttled search and a rare track read the same, so the pace is ours: the
# one rate measured going silent was 0.9 a second.
search_interval = 1.0

[genres]
# The vocabulary's mapping table, which lives in music-tagger: its taxonomy maps the names the rest of the
# world uses onto the families this collection has. Point it at that project's own taxonomy.json; empty or
# absent means genres stay blank, which is what a machine without music-tagger installed wants.
taxonomy = ""

[traktor]
# Traktor's collection is another project's to write. This is how to run its tool here; a machine without it
# leaves the collection alone.
command = ["traktor-nml"]

[credentials]
# Names only — never the secrets.
musicbrainz_contact = "MUSICBRAINZ_CONTACT"
acoustid_key        = "ACOUSTID_API_KEY"
discogs_token       = "DISCOGS_TOKEN"
soulseek_user       = "SLSK_USERNAME"
soulseek_password   = "SLSK_PASSWORD"

[tools]
# Both ship with the project; set either to use another build.
# convert   = "tools/convert_to_aiff.sh"
# normalize = "vendor/loudness_normalizer/loudness_normalizer.py"
