# Copy to `config.toml` and edit. Credentials and the Soulseek ports live in `.env`.

[paths]
# Relative paths resolve against this file's directory.
staging    = "~/Music/music-agent/staging"
lossless   = "~/Music/music-agent/lossless"
lossy      = "~/Music/music-agent/lossy"
state      = "~/Music/music-agent/state"
# The ignore list, beside the runs rather than inside one: it belongs to the account, not to a pass.
peers      = "~/Music/music-agent/state/peers.json"

[loudness]
target_lufs  = -14.0
true_peak_db = -1.0
tolerance_lu = 0.5                              # a file already inside it is left alone

[soulseek]
# `soulseek-rs daemon` holds the account and speaks JSON-RPC over a Unix socket in `state_dir`. The pass
# starts it when nothing answers there and leaves it running: the session and any unfinished transfers are
# the daemon's, and the next pass picks them up.
command = ["soulseek-rs", "daemon"]

# Where the daemon keeps its socket, token and transfer state. Empty uses `SOULSEEK_STATE_DIR`, then the
# daemon's own default (`~/.local/share/soulseek-rs/state`). Both ends have to look in the same place.
state_dir = ""

# The listening port is in `.env`. The daemon registers exactly that one; its neighbour is only swept in
# case a client that used both is still alive. The download directory is not here either: `paths.staging` is
# set on the daemon at the start of every pass, and the two lanes under `paths` are what it shares. Staging
# is not one of them. A client that reports no shared files reads as a leecher, and peers queue or ban those.
max_downloads = 20
workers       = 20

# Seconds between two searches: 34 per 220 seconds, the rate slsk-batchdl ships, whose README warns that
# higher values earn 30-minute bans. Stated as a gap rather than a burst, so the sustained rate is the same
# and no window of the pass is heavier than another.
search_interval = 6.47

# fail2ban's three numbers, for peers that list a file and then deliver nothing — paid mirrors and bots fail
# every request, while a peer with a long queue or a bad rip is not failing at all. `maxretry` failures
# inside `findtime_days`, counted across runs, earn an ignore lasting `bantime_days`; a delivery clears the
# count. `music-agent peers` lists them, `music-agent peers --unban USER` asks one again.
maxretry      = 3
findtime_days = 14
bantime_days  = 30

[genres]
# The vocabulary's mapping table, which lives in music-tagger: its taxonomy maps the names the rest of the
# world uses onto the families this collection has. Point it at that project's own taxonomy.json; empty or
# absent means genres stay blank, which is what a machine without music-tagger installed wants.
taxonomy = ""

[export]
# The collections a run writes to, in this order. `rekordbox` and `traktor` ship; a target that is not
# installed here is reported and skipped, and naming only one is a complete config.
targets = ["rekordbox", "traktor"]

[traktor]
# Traktor's collection is another project's to write. This is how to run its tool here; a machine without it
# leaves the collection alone.
command = ["traktor-nml"]

[credentials]
# Names only — never the secrets.
musicbrainz_contact = "MUSICBRAINZ_CONTACT"
acoustid_key        = "ACOUSTID_API_KEY"
discogs_token       = "DISCOGS_TOKEN"
soulseek_user       = "SLSK_USERNAME"
soulseek_password   = "SLSK_PASSWORD"

[tools]
# Both ship with the project; set either to use another build.
# convert   = "tools/convert_to_aiff.sh"
# normalize = "vendor/loudness_normalizer/loudness_normalizer.py"
