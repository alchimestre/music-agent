name: Windows desktop

# Builds the standalone Windows application. A tagged run is meant to be a release and refuses to
# produce an unsigned artifact; a manually dispatched run is an internal validation build and is named
# as unsigned. Neither replaces the Windows 11 proof on a clean machine: this job produces the artifact.
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      # Nuitka reads its cache from here, so the dependency walker below lands where it looks.
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked --no-default-groups --extra desktop --group windows-build

      # The C compiler Nuitka invokes.
      - name: Provide the MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Nuitka resolves the DLLs a build needs with depends.exe and refuses standalone mode without it.
      # The binary is placed at the cache path Nuitka's lookup reads first, so the build does not depend
      # on the upstream host answering a prompt it cannot show.
      - name: Provide the dependency walker
        run: |
          $cache = Join-Path $env:NUITKA_CACHE_DIR "downloads\depends\x86_64"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "depends22_x64.zip"
          Invoke-WebRequest -Uri "https://dependencywalker.com/depends22_x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "depends") -Force
          $found = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "depends") -Filter "depends.exe" -Recurse | Select-Object -First 1
          if (-not $found) {
            throw "The dependency walker archive held no depends.exe"
          }
          Copy-Item $found.FullName (Join-Path $cache "depends.exe") -Force
          Write-Host "dependency walker: $(Join-Path $cache 'depends.exe')"

      - name: Stage the bundled tools
        run: uv run python packaging/windows/stage.py

      - name: Generate the deployment specification
        run: uv run pyside6-deploy --init -f

      - name: Build the standalone application
        run: uv run pyside6-deploy --no-install -f -c pysidedeploy.spec

      - name: Sign the application
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE) {
            throw "A tagged build is a release and must be signed: set the WINDOWS_SIGNING_CERTIFICATE secret."
          }
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) {
            throw "signtool.exe is not on this runner; install the Windows SDK signing tools."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          Get-ChildItem build/windows/*.dist/*.exe | ForEach-Object {
            & $signtool.Source sign /f $certificate /p $env:SIGNING_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)." }
          }

      - name: Assemble the artifact
        run: |
          if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
            uv run python packaging/windows/assemble.py build/windows --signed
          } else {
            Add-Content $env:GITHUB_STEP_SUMMARY "Internal validation build: unsigned, not a release artifact."
            uv run python packaging/windows/assemble.py build/windows
          }

      - uses: actions/upload-artifact@v7
        with:
          name: music-agent-windows
          path: |
            build/windows/music-agent-windows-*.zip
            build/windows/music-agent-windows-*.zip.sha256
          if-no-files-found: error
