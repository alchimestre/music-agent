[project]
name = "music-agent"
version = "0.1.0"
readme = "README.md"
license = "MIT"
description = "Acquire, process and import tracks into a rekordbox collection: Soulseek, loudness normalization, tagging from MusicBrainz"
requires-python = ">=3.13"
# musicbrainzngs is pinned: 0.7.1 returns no `genres` include, which is why the genre path calls ws/2
# directly. pyrekordbox is pinned to the schema version this was written against. mutagen reads a length
# straight from a header, in about a millisecond, which is what makes indexing the library directories cheap
# enough to do every run.
dependencies = [
    "musicbrainzngs==0.7.1",
    "pyrekordbox==0.4.3",
    "mutagen",
    # Identification by sound: pyacoustid fingerprints through the `fpcalc` binary (chromaprint), which is
    # not a Python package and has to be installed separately.
    "pyacoustid",
]

[project.scripts]
music-agent = "music_agent.cli:main"

[project.urls]
Repository = "https://github.com/alchimestre/music-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_agent"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
