[project]
name = "music-agent"
version = "0.1.0"
description = "Acquire, process and import tracks into rekordbox, following the decisions in the design notes"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
music-agent = "music_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_agent"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
