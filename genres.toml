# What other people call it, on the left; what this collection calls it, on the right.
#
# Ticket 06: a curated table, corrected by hand, with the gaps left to the working procedure — a model chooses among
# the library's genres or declines, and only a decline reaches the user. A mapping whose target is not a
# genre the collection actually has is ignored rather than trusted, because the vocabulary is read from
# the database at run time and this file can drift from it.
#
# The most specific name wins, so `minimal` beats `techno` when a release carries both.
#
# Evidence, because the choice of source was measured rather than assumed:
#
#   MusicBrainz genres were tried first and abandoned. A sample of the collection had `electronic` alone
#   claiming ten different library genres, and `techno` five. They are here as a second opinion only.
#
#   Discogs styles were measured with three tracks from every genre in the collection. The specific ones
#   are clean — `hardcore` → Hard Techno (2 of 3), `minimal` → Minimal / Deep Tech (2 of 3),
#   `synth-pop` → Pop (2 of 3), `hardcore hip-hop` → Hip Hop (2 of 3), `trance` → Trance (2 of 3) — and
#   the broad ones are not, which is why several are deliberately absent.
#
# Deliberately absent, with the reason, so nobody re-adds them hopefully:
#
#   `techno`      split four ways across the collection (Techno, Minimal / Deep Tech,
#                 Techno (Raw / Deep / Hypnotic), Melodic House & Techno)
#   `electro`     split across Electro, House, Hip Hop, Pop and Techno (Raw / Deep / Hypnotic)
#   `acid`        split across Electro, Hard Techno, House and Trance
#   `downtempo`   split across Melodic House & Techno, Psy-Trance, Downtempo / Trip-Hop and World
#   `experimental` split across Hip Hop, Rock, Tech House and Ambient / Experimental
#   `breakbeat`   split across Hard Techno, House and Breakbeat / Bass
#   `folk`        split evenly between Folk and World — the collection keeps both, and nothing external
#                 separates them
#   `ambient`     appeared against Pop, Techno (Raw / Deep / Hypnotic) and Techno
#
# A track whose styles are all in that list gets a blank genre, which is where the working procedure comes in.
#
# Consequence worth knowing: `Acid Core` has no path *into* it at all, because the one style that would
# lead there — `acid` — is in the list above. It is reached only by the working procedure choosing it, or by the user
# correcting a file after import.

# Genres the collection is allowed to gain. A name here is one the user has accepted from a proposal — a
# mapping may point at it, the file will be tagged with it, and the import mints the row (the design notes).
approved = []

[map]
# --- what Discogs' own names already are in this collection (identity, and the safest kind of mapping) ---
"techno"        = "Techno"
"house"         = "House"
"deep house"    = "Deep House"
"electro"       = "Electro"
"hip hop"       = "Hip Hop"
"trap"          = "Hip Hop"
